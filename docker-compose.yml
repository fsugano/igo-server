# Local production-like stack: docker compose up --build → http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: igo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/igo
      # Set to production only behind HTTPS (secure cookies).
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
